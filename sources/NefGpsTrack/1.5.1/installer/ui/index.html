<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>途记安装程序</title>
<style>
  :root{
    --bg:#f3f8ff;--paper:#ffffff;--paper-soft:#f7fbff;--line:#dbe8f6;--ink:#1d2b3a;
    --muted:#5d7590;--muted-soft:#8ba3bd;--brand:#2f86d8;--brand-deep:#1f6cb4;
    --pale:#e8f2fd;--ok:#2f9e6b;--warn:#d9862f;--danger:#d2544f;
    --r-lg:20px;--r-md:14px;--r-sm:10px;--r-pill:999px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:26px 28px 22px;background:var(--bg);color:var(--ink);
    font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;
  }
  h1{margin:0;font-size:22px;letter-spacing:.3px}
  .eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted-soft);font-weight:600}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .badge{
    width:46px;height:46px;border-radius:var(--r-md);flex-shrink:0;
    background:linear-gradient(150deg,#4a9ee8,#2f86d8);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
    box-shadow:0 8px 18px #2f86d83d;
  }
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px 22px;margin-bottom:14px;
  }
  .card h2{margin:0 0 4px;font-size:15px}
  .card p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  .state{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
    padding:5px 12px;border-radius:var(--r-pill);background:var(--pale);color:var(--brand-deep);
  }
  .state.fresh{background:#e9f7f0;color:var(--ok)}
  .state.upgrade{background:#fdf2e4;color:var(--warn)}
  .state i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
  label{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 7px}
  .row{display:flex;gap:9px;align-items:stretch}
  input[type=text]{
    flex:1;min-width:0;padding:11px 14px;border-radius:var(--r-sm);
    border:1px solid var(--line);background:var(--paper-soft);color:var(--ink);
    font:inherit;font-size:13px;user-select:text;
  }
  input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #2f86d82e}
  input[readonly]{color:var(--muted);background:#f1f5fa;cursor:default}
  button{
    border:none;border-radius:var(--r-sm);padding:11px 18px;font:inherit;font-size:13px;
    font-weight:600;cursor:pointer;transition:transform .15s var(--ease),box-shadow .2s var(--ease);
    background:var(--paper-soft);color:var(--brand-deep);border:1px solid var(--line);
  }
  button:hover:not(:disabled){transform:translateY(-1px)}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  button.primary{
    background:linear-gradient(150deg,#4a9ee8,#2f86d8);color:#fff;border:none;
    box-shadow:0 8px 18px #2f86d833;
  }
  button.wide{width:100%;padding:13px;font-size:14px}
  .hint{font-size:12px;margin-top:8px;display:flex;gap:7px;align-items:flex-start}
  .hint.ok{color:var(--ok)}.hint.bad{color:var(--danger)}.hint.warn{color:var(--warn)}
  .actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .actions .line{display:flex;gap:9px}
  .actions .line button{flex:1}
  progress{
    width:100%;height:9px;border-radius:var(--r-pill);appearance:none;
    border:none;background:var(--pale);overflow:hidden;margin-top:4px;
  }
  progress::-webkit-progress-bar{background:var(--pale);border-radius:var(--r-pill)}
  progress::-webkit-progress-value{background:linear-gradient(90deg,#4a9ee8,#2f86d8);border-radius:var(--r-pill);transition:width .3s var(--ease)}
  .steps{font-size:12.5px;color:var(--muted);margin-top:9px;min-height:20px}
  .done{font-size:12.5px;color:var(--ink);margin-top:10px;white-space:pre-line}
  .done.err{color:var(--danger)}
  .foot{font-size:11.5px;color:var(--muted-soft);text-align:center;margin-top:4px}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="head">
    <div class="badge">途</div>
    <div>
      <div class="eyebrow">NEF GPS STUDIO</div>
      <h1>途记 <span id="version">…</span> 安装程序</h1>
    </div>
  </div>

  <div class="card">
    <div id="state-badge" class="state"><i></i><span id="state-text">正在检查本机…</span></div>
    <p id="state-note"></p>

    <label for="path">安装位置</label>
    <div class="row">
      <input id="path" type="text" spellcheck="false" placeholder="选择安装文件夹">
      <button id="browse">浏览…</button>
    </div>
    <div id="path-hint" class="hint"></div>

    <div id="legacy-box" class="card" style="margin:16px 0 0;padding:13px 15px;border-radius:var(--r-md)" hidden>
      <h2 style="font-size:13px">发现旧版数据</h2>
      <p id="legacy-text" style="font-size:12px"></p>
      <label class="check" style="display:flex;align-items:center;gap:9px;margin:11px 0 0;color:var(--ink)">
        <input id="migrate" type="checkbox" checked style="width:16px;height:16px;accent-color:var(--brand)">
        <span style="font-size:12.5px">把旧版轨迹与设置搬进新的数据目录（原目录保留不删）</span>
      </label>
    </div>
  </div>

  <div class="card" id="run-card" hidden>
    <progress id="bar" value="0" max="100"></progress>
    <div class="steps" id="steps">准备中…</div>
    <div class="done" id="done" hidden></div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="go" class="primary wide" disabled>开始安装</button>
      <div class="line">
        <button id="default-path">用默认位置</button>
        <button id="close">取消</button>
      </div>
    </div>
  </div>

  <p class="foot">安装后程序与数据都放在上面选定的文件夹里，可以整个目录拷走。</p>

<script>
const $=s=>document.querySelector(s);
const api=(action,args)=>window.pywebview.api.request(action,args||{});
let info=null,mode='install',checkTimer=null;

function setHint(text,kind){
  const el=$('#path-hint');
  el.textContent=text||'';
  el.className='hint'+(kind?' '+kind:'');
}
function markState(kind,text,note){
  $('#state-badge').className='state '+(kind||'');
  $('#state-text').textContent=text;
  $('#state-note').textContent=note||'';
}

async function verify(){
  const path=$('#path').value.trim();
  if(!path){setHint('请输入安装位置','bad');$('#go').disabled=true;return;}
  const r=await api('check',{path});
  if(r.error){setHint(r.error,'bad');$('#go').disabled=true;return;}
  if(r.writable){setHint('该位置可写，可以安装。','ok');$('#go').disabled=false;}
  else{setHint(r.reason||'该位置不可写','bad');$('#go').disabled=true;}
}

async function boot(){
  info=await api('probe');
  if(info.error){markState('','检查失败',info.error);return;}
  $('#version').textContent=info.version;
  if(info.probeError)setHint('读取安装记录失败：'+info.probeError,'warn');

  if(info.installed){
    mode='upgrade';
    markState('upgrade',`检测到已安装 ${info.installed.version}`,`将升级到 ${info.version}，覆盖原安装位置，${info.dataFolder} 里的数据保持不动。`);
    $('#path').value=info.installed.location;
    $('#path').readOnly=true;
    $('#browse').disabled=true;
    $('#default-path').hidden=true;
    $('#go').textContent='开始升级';
  }else{
    mode='install';
    markState('fresh','本机尚未安装','选择一个安装位置；程序和数据都会放在这个文件夹里。');
    $('#path').value=info.defaultDir;
    $('#go').textContent='开始安装';
  }

  if(info.legacy&&info.legacy.found){
    $('#legacy-box').hidden=false;
    $('#legacy-text').textContent=`旧版数据在 ${info.legacy.path}。勾选后会复制到新数据目录，原目录不会删除。`;
  }
  if(!info.payloadReady)setHint('安装载荷缺失，请重新获取安装程序','bad');
  await verify();
}

$('#browse').onclick=async()=>{
  const r=await api('pick');
  if(r.cancelled||r.error)return;
  $('#path').value=r.path;
  await verify();
};
$('#default-path').onclick=async()=>{$('#path').value=info.defaultDir;await verify();};
$('#path').oninput=()=>{clearTimeout(checkTimer);checkTimer=setTimeout(verify,350);};
$('#close').onclick=()=>api('finish',{action:'close'});
$('#go').onclick=async()=>{
  $('#go').disabled=true;
  $('#run-card').hidden=false;
  $('#done').hidden=true;
  $('#bar').value=2;
  $('#steps').textContent='准备中…';
  const r=await api('run',{mode,target:$('#path').value.trim(),migrate:$('#migrate').checked});
  if(r.error){window.installDone({ok:false,error:r.error});}
};

window.installProgress=(message,percent)=>{
  $('#bar').value=percent;
  $('#steps').textContent=message+'…';
};
window.installDone=result=>{
  const done=$('#done');
  done.hidden=false;
  if(result.ok){
    $('#bar').value=100;
    $('#steps').textContent='安装完成';
    const m=result.migrated||{};
    let text=`已${result.mode==='upgrade'?'升级':'安装'}到：\n${result.target}`;
    if(m.found)text+=`\n\n旧版数据：迁移 ${m.routes||0} 条轨迹`+(m.settings?'、设置已迁移':'')+(m.skipped?`，跳过 ${m.skipped} 条`:'')+`\n原目录保留在：${m.kept}`;
    text+='\n\n数据文件夹：data\\路径库（轨迹，可直接拷走）、data\\程序数据（程序自用）';
    done.className='done';done.textContent=text;
    $('#go').hidden=true;$('#default-path').hidden=true;
    $('#close').textContent='关闭';
    const line=document.createElement('button');
    line.className='primary';line.textContent='立即打开途记';
    line.onclick=()=>api('finish',{action:'launch'});
    $('.actions').prepend(line);
  }else{
    $('#bar').value=0;
    $('#steps').textContent='安装未完成';
    done.className='done err';
    done.textContent=result.error||'未知错误';
    $('#go').hidden=false;$('#go').disabled=false;
  }
};

boot();
</script>
</body>
</html>
